<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Culture I/O </title>
<style>
  html, body { margin: 0; height: 100%; background: #ffffff; overflow: hidden; }
  /* 3d-force-graph's built-in hover tooltip -- rendered by the library
     itself as a floating div, not something this page draws, so it needs
     its own override rather than inheriting page styles. */
  .scene-tooltip {
    color: #333 !important;
  }
  #graph { width: 100vw; height: 100vh; }
  #status-bar {
    position: fixed; top: 10px; left: 10px; z-index: 10;
    display: flex; align-items: center; gap: 12px;
    font-family: sans-serif; font-size: 14px; color: #333;
  }
  #status {
  display: none;
  }

  #tour-toggle:hover { background: rgba(0, 0, 0, 0.1); }

  #image-popup-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    padding: 20px;
    box-sizing: border-box;
  }
  #image-popup-overlay.open { display: flex; }
  #image-popup-img {
    max-width: 90vw;
    max-height: 80vh;
    border-radius: 8px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
  }
  #image-popup-caption {
    color: #fff;
    font-family: sans-serif;
    margin-top: 15px;
    max-width: 80vw;
    text-align: center;
    font-size: 1rem;
  }
  #image-popup-close {
    position: absolute;
    top: 20px;
    right: 30px;
    background: none;
    border: none;
    color: #fff;
    font-size: 2.5rem;
    line-height: 1;
    cursor: pointer;
  }
</style>
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script src="https://unpkg.com/3d-force-graph@1.73.3/dist/3d-force-graph.min.js"></script>
</head>
<body>
<div id="status-bar">
  <span id="status">Loading graph data...</span>
</div>
<div id="graph"></div>

<div id="image-popup-overlay">
  <button id="image-popup-close" aria-label="Close">&times;</button>
  <img id="image-popup-img" alt="">
  <div id="image-popup-caption"></div>
</div>
<script>
  const imagePopupOverlay = document.getElementById('image-popup-overlay');
  const imagePopupImg = document.getElementById('image-popup-img');
  const imagePopupCaption = document.getElementById('image-popup-caption');
  const imagePopupClose = document.getElementById('image-popup-close');

  function showImagePopup(imgUrl, caption) {
    imagePopupImg.src = imgUrl || '';
    if (caption && caption.trim() !== '') {
      imagePopupCaption.textContent = caption;
      imagePopupCaption.style.display = 'block';
    } else {
      imagePopupCaption.textContent = '';
      imagePopupCaption.style.display = 'none';
    }
    imagePopupOverlay.classList.add('open');
  }

  function hideImagePopup() {
    imagePopupOverlay.classList.remove('open');
    imagePopupImg.src = '';
  }

  imagePopupClose.addEventListener('click', hideImagePopup);
  imagePopupOverlay.addEventListener('click', (e) => {
    if (e.target === imagePopupOverlay) hideImagePopup();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') hideImagePopup();
  });
</script>

<script>
  // Bounded LRU cache for node textures
  const TEXTURE_CACHE_LIMIT = 400; // max 400 before disposing the least used cache
  const textureCache = new Map(); //for LRU order

  function getTexture(url) {
    if (textureCache.has(url)) {
      // Touch: re-insert so this entry becomes "most recently used".
      const texture = textureCache.get(url);
      textureCache.delete(url);
      textureCache.set(url, texture);
      return texture;
    }

    if (textureCache.size >= TEXTURE_CACHE_LIMIT) {
      // Map iteration order is insertion order, so the first key is the
      // least-recently-used one.
      const oldestUrl = textureCache.keys().next().value;
      const oldestTexture = textureCache.get(oldestUrl);
      oldestTexture.dispose(); // frees the GPU-side texture memory
      textureCache.delete(oldestUrl);
    }

    const imgEl = new Image();
    imgEl.crossOrigin = "anonymous";
    const texture = new THREE.Texture(imgEl);
    imgEl.onload = () => { texture.needsUpdate = true; };
    imgEl.onerror = () => console.error("Failed to load image for texture:", url);
    imgEl.src = url;
    textureCache.set(url, texture);
    return texture;
  }

  // Renders a hub as its representative photo (letterboxed into a square,
  // ringed in orange) with the category label underneath -- baked onto one
  // canvas texture since a THREE.Sprite can only carry a single image.
  function makeHubSprite(label, imgUrl) {
    const photoArea = 200;
    const labelHeight = 40;
    const canvas = document.createElement("canvas");
    canvas.width = photoArea;
    canvas.height = photoArea + labelHeight;
    const ctx = canvas.getContext("2d");

    const texture = new THREE.CanvasTexture(canvas);
    const material = new THREE.SpriteMaterial({ map: texture, transparent: true });
    const sprite = new THREE.Sprite(material);
    // Hubs render larger than regular photo sprites (~14 world units) so
    // the representative photo reads as the center of its cluster.
    const worldHeight = 22;
    sprite.scale.set((canvas.width / canvas.height) * worldHeight, worldHeight, 1);

    const draw = (imgEl) => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (imgEl && imgEl.naturalWidth) {
        const scale = Math.min(photoArea / imgEl.naturalWidth, photoArea / imgEl.naturalHeight);
        const w = imgEl.naturalWidth * scale;
        const h = imgEl.naturalHeight * scale;
        const x = (photoArea - w) / 2;
        const y = (photoArea - h) / 2;
        ctx.drawImage(imgEl, x, y, w, h);
        ctx.strokeStyle = "#ffaa33";
        ctx.lineWidth = 8;
        ctx.strokeRect(x, y, w, h);
      } else {
        ctx.fillStyle = "#cccccc";
        ctx.fillRect(0, 0, photoArea, photoArea);
      }
      ctx.fillStyle = "#333333";
      ctx.font = "bold 26px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(label, canvas.width / 2, photoArea + labelHeight / 2);
      texture.needsUpdate = true;
    };

    draw(null); // placeholder box + label right away, photo fills in once loaded

    if (imgUrl) {
      const photoTexture = getTexture(imgUrl); // reuses the same load/cache path as regular nodes
      const imgEl = photoTexture.image;
      if (imgEl.complete && imgEl.naturalWidth) {
        draw(imgEl);
      } else {
        imgEl.addEventListener("load", () => draw(imgEl));
      }
    }

    return sprite;
  }

  // Deterministic hash so the same category always lands in the same
  // spot in space across reloads, instead of jumping around each time.
  function hashString(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) h = (Math.imul(h, 31) + str.charCodeAt(i)) | 0;
    return h;
  }

  // One stable anchor point per scene category, spread out on a sphere
  // so different clusters land in visibly separate parts of the graph.
  const CLUSTER_RADIUS = 260;
  const clusterAnchors = new Map();
  function anchorFor(category) {
    if (!clusterAnchors.has(category)) {
      const h = hashString(category);
      const theta = ((h % 10000) / 10000) * Math.PI * 2;
      const phi = (((h >> 12) % 10000) / 10000) * Math.PI - Math.PI / 2;
      clusterAnchors.set(category, {
        x: CLUSTER_RADIUS * Math.cos(phi) * Math.cos(theta),
        y: CLUSTER_RADIUS * Math.sin(phi),
        z: CLUSTER_RADIUS * Math.cos(phi) * Math.sin(theta),
      });
    }
    return clusterAnchors.get(category);
  }

  // Pulls each node toward its scene category's anchor point.
  // Confidence controls the pull strength: a confident classification
  // (close to 1.0) snaps tightly into its cluster; a low-confidence one
  // barely pulls at all and stays loose, drifting near cluster boundaries.
  function sceneClusterForce(alpha) {
    for (const node of Graph.graphData().nodes) {
      if (node.isHub) continue;
      const anchor = anchorFor(node.sceneSpecific || "unclassified");
      const strength = 0.02 + 0.2 * (node.sceneConfidence || 0);
      node.vx += (anchor.x - node.x) * strength * alpha;
      node.vy += (anchor.y - node.y) * strength * alpha;
      node.vz += (anchor.z - node.z) * strength * alpha;
    }
  }

  let Graph;
  let knownIds = new Set();

  // Auto Tour mode -- automatically zooms into each photo in turn, holds,
  // zooms back out to the overview, then moves to the next one. Same
  // state machine as graphscratch1.html's tour, adapted to 3D: instead of
  // manually tweening pan/zoom on a 2D canvas, this drives the camera via
  // 3d-force-graph's own cameraPosition()/zoomToFit() APIs. Driven off its
  // own requestAnimationFrame loop, independent of the library's internal
  // physics/render loop.

  const TOUR_OVERVIEW = 0;
  const TOUR_ZOOM_IN = 1;
  const TOUR_HOLD = 2;
  const TOUR_ZOOM_OUT = 3;
  const DURATIONS_MS = {
    [TOUR_OVERVIEW]: 4000,
    [TOUR_ZOOM_IN]: 2000,
    [TOUR_HOLD]: 7000,
    [TOUR_ZOOM_OUT]: 2000,
  };
  // How far outside the node the camera parks during ZOOM_IN/HOLD, along
  // the ray from the graph's center through the node -- the standard
  // "click to focus" pattern for this library.
  const FOCUS_DISTANCE = 30;
  const OVERVIEW_PADDING = 60;

  let mode = 'manual'; // 'manual' | 'tour'
  let tourState = TOUR_OVERVIEW;
  let tourStateStartTime = 0;
  let tourIndex = 0;             // round-robin position in the node list
  let tourPriorityQueue = [];    // ids of new submissions waiting to be shown next
  let currentTourNode = null;    // live node object currently focused during ZOOM_IN/HOLD

  // Camera tween state for ZOOM_IN only -- HOLD just keeps re-snapping to
  // the (possibly drifting) live node position every frame, and
  // ZOOM_OUT/OVERVIEW delegate to the library's own zoomToFit() animation.
  const tween = { active: false, startTime: 0, duration: 1, startPos: { x: 0, y: 0, z: 0 } };

  function easeInOutQuad(t) {
    return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  }

  // The "aim at node from outside it" position used by 3d-force-graph's
  // own click-to-focus example -- offsets along the ray from the graph
  // center through the node, so the camera approaches from outside the
  // cluster rather than clipping through other nodes.
  function focusPositionFor(node) {
    const dist = Math.hypot(node.x, node.y, node.z);
    if (dist < 1e-6) return { x: 0, y: 0, z: FOCUS_DISTANCE }; // node sits at the origin
    const distRatio = 1 + FOCUS_DISTANCE / dist;
    return { x: node.x * distRatio, y: node.y * distRatio, z: node.z * distRatio };
  }

  // Chronological round-robin through the photo nodes, except newly
  // arrived submissions (pushed on by interruptForNewSubmission) always
  // jump the queue.
  function pickNextNode() {
    while (tourPriorityQueue.length) {
      const id = tourPriorityQueue.shift();
      const candidate = Graph.graphData().nodes.find(n => n.id === id);
      if (candidate && !candidate.isHub) return candidate;
      // else: node was removed/unapproved before its turn came up -- skip it
    }

    const photoNodes = Graph.graphData().nodes.filter(n => !n.isHub);
    if (!photoNodes.length) return null;
    tourIndex = tourIndex % photoNodes.length;
    const node = photoNodes[tourIndex];
    tourIndex = (tourIndex + 1) % photoNodes.length;
    return node;
  }

  function enterTourState(state, now) {
    tourState = state;
    tourStateStartTime = now;

    if (state === TOUR_ZOOM_IN) {
      currentTourNode = pickNextNode();
      if (currentTourNode) {
        const cam = Graph.camera();
        tween.active = true;
        tween.startTime = now;
        tween.duration = DURATIONS_MS[TOUR_ZOOM_IN];
        tween.startPos = { x: cam.position.x, y: cam.position.y, z: cam.position.z };
      }
    } else if (state === TOUR_ZOOM_OUT) {
      tween.active = false;
      Graph.zoomToFit(DURATIONS_MS[TOUR_ZOOM_OUT], OVERVIEW_PADDING);
      currentTourNode = null;
    } else {
      // TOUR_OVERVIEW: camera's already framed correctly (ZOOM_OUT just
      // finished, or startTour() just snapped us here) -- just hold.
      // TOUR_HOLD: nothing to kick off here; the tour loop below keeps
      // the camera on currentTourNode's live position for the whole
      // hold, the timer alone decides when we move on.
      tween.active = false;
      currentTourNode = state === TOUR_HOLD ? currentTourNode : null;
    }
  }

  // New submissions cut the current hold/zoom-in short: zoom out immediately,
  // then the interrupted node's replacement (this new one) becomes the very
  // next ZOOM_IN target via the priority queue.
  function interruptForNewSubmission(newNodeIds) {
    tourPriorityQueue.push(...newNodeIds);
    if (tourState === TOUR_HOLD || tourState === TOUR_ZOOM_IN) {
      enterTourState(TOUR_ZOOM_OUT, performance.now());
    }
    // If we're already in OVERVIEW or ZOOM_OUT, no need to interrupt --
    // the queue gets consulted the next time ZOOM_IN starts anyway.
  }

  function startTour() {
    mode = 'tour';
    Graph.controls().enabled = false; // ignore manual drag/orbit while touring

    const now = performance.now();
    // Short catch-up snap from wherever the user left the camera, capped
    // so it never runs longer than the overview hold itself.
    Graph.zoomToFit(Math.min(1200, DURATIONS_MS[TOUR_OVERVIEW]), OVERVIEW_PADDING);
    tourState = TOUR_OVERVIEW;
    tourStateStartTime = now;
    currentTourNode = null;
  }

  function stopTour() {
    mode = 'manual';
    Graph.controls().enabled = true;
    tween.active = false;
    currentTourNode = null;
  }

  // Idle-triggered Auto Tour 

  const IDLE_TIMEOUT_MS = 10000; // 10sec inactivity, start autotour
  let idleTimer = null;

  function resetIdleTimer() {
    if (mode === 'tour') stopTour();
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
      if (mode === 'manual') startTour();
    }, IDLE_TIMEOUT_MS);
  }

  ['mousedown', 'wheel'].forEach(evt =>
    window.addEventListener(evt, resetIdleTimer, { passive: true })
  );

  // Drives tour state transitions and, during ZOOM_IN/HOLD, repositions
  // the camera every frame -- separate from 3d-force-graph's own internal
  // render loop, which keeps running regardless.
  function tourFrame(now) {
    if (mode === 'tour') {
      const elapsed = now - tourStateStartTime;
      if (elapsed >= DURATIONS_MS[tourState]) {
        enterTourState((tourState + 1) % 4, now);
      }

      if (tourState === TOUR_ZOOM_IN && tween.active && currentTourNode) {
        const t = Math.min((now - tween.startTime) / tween.duration, 1);
        const eased = easeInOutQuad(t);
        const target = focusPositionFor(currentTourNode); // recomputed live -- tracks drift
        const pos = {
          x: tween.startPos.x + (target.x - tween.startPos.x) * eased,
          y: tween.startPos.y + (target.y - tween.startPos.y) * eased,
          z: tween.startPos.z + (target.z - tween.startPos.z) * eased,
        };
        Graph.cameraPosition(pos, currentTourNode, 0);
        if (t >= 1) tween.active = false;
      } else if (tourState === TOUR_HOLD && currentTourNode) {
        // Zoom-in finished -- just keep tracking the node's live position
        // in case physics nudges it (e.g. a fresh reheat from elsewhere).
        Graph.cameraPosition(focusPositionFor(currentTourNode), currentTourNode, 0);
      }
    }
    requestAnimationFrame(tourFrame);
  }

  // How often to check the server for new submissions. Just a polling
  // interval against the existing /api/graph-data endpoint -- no server
  // changes needed. Bump this up/down if you want fresher/less-chatty updates.
  const POLL_MS = 15000;

  function flashStatus(msg, revertTo) {
    const el = document.getElementById("status");
    el.textContent = msg;
    if (revertTo) setTimeout(() => { el.textContent = revertTo; }, 4000);
  }

  function fetchGraphData() {
    return fetch("/api/graph-data").then(r => r.json());
  }

  // Initial load: builds the graph from scratch.
  function initGraph({ nodes, edges }) {
    knownIds = new Set(nodes.map(n => n.id));
    lastGraphSignature = graphSignature(nodes, edges);
    const summary = `${nodes.filter(n => !n.isHub).length} images, ${edges.length} connections`;
    document.getElementById("status").textContent = summary;

    const gData = {
      nodes: nodes.map(n => ({
        id: n.id, img: n.img, fullImg: n.fullImg, caption: n.caption, isHub: n.isHub, label: n.label,
        sceneBroad: n.sceneBroad, sceneSpecific: n.sceneSpecific,
        sceneConfidence: n.sceneConfidence,
      })),
      links: edges.map(e => ({ source: e.source, target: e.target, confidence: e.confidence }))
    };

    Graph = ForceGraph3D()(document.getElementById("graph"))
      .backgroundColor("#ffffff")
      .showNavInfo(false)
      .graphData(gData)
      .nodeLabel(n => n.isHub ? n.label : (n.caption || ''))
      .linkDirectionalArrowLength(link => link.confidence ? 0 : 4)
      .linkDirectionalArrowRelPos(1)
      .linkCurvature(0.15)
      // Higher-confidence images draw a brighter, more opaque link to their hub.
      .linkColor(link => `rgba(90,90,220,${0.2 + 0.6 * (link.confidence || 0)})`)
      .linkWidth(link => 0.5 + 2 * (link.confidence || 0))
      .nodeThreeObject(n => {
        if (n.isHub) {
          return makeHubSprite(n.label, n.img);
        }
        const texture = getTexture(n.img);
        const material = new THREE.SpriteMaterial({
          map: texture,
          transparent: true
        });
        const sprite = new THREE.Sprite(material);
        const maxDim = 14;
        sprite.scale.set(maxDim, maxDim, 1); // fallback square until the image loads

        // Once the photo loads, reshape the sprite to its real aspect ratio
        // instead of leaving it stretched into a square -- no forced shape.
        const applyAspectRatio = () => {
          const img = texture.image;
          if (!img || !img.naturalWidth) return;
          const scale = maxDim / Math.max(img.naturalWidth, img.naturalHeight);
          sprite.scale.set(img.naturalWidth * scale, img.naturalHeight * scale, 1);
        };
        if (texture.image && texture.image.complete && texture.image.naturalWidth) {
          applyAspectRatio();
        } else if (texture.image) {
          texture.image.addEventListener("load", applyAspectRatio);
        }
        return sprite;
      })
      .onNodeClick(node => {
        if (node.isHub) return;
        // Popup shows the full-res original -- fine to load on demand since
        // it's one image at a time, not 300 sitting in GPU memory at once.
        showImagePopup(node.fullImg || node.img, node.caption);
      });

    // Confidence also sets how strongly each link pulls its image toward the hub
    Graph.d3Force('link').strength(link => 0.05 + 0.4 * (link.confidence || 0));
    Graph.d3Force('cluster', sceneClusterForce);

    resetIdleTimer(); // arms the initial 20s countdown to auto-tour
    requestAnimationFrame(tourFrame);

    startPolling(summary);
  }

  // Builds a stable signature of "what's actually in the graph" so we can
  // tell a genuinely new poll result apart from an unchanged one. Node IDs
  // cover new/removed submissions; hub img is included too, since a hub's
  // representative photo can change (a new highest-confidence submission
  // in that category) without the hub's own node ID changing.
  function graphSignature(nodes, edges) {
    const nodePart = nodes
      .map(n => `${n.id}:${n.isHub ? n.img || '' : ''}`)
      .sort()
      .join('|');
    const edgePart = edges
      .map(e => `${e.source}->${e.target}`)
      .sort()
      .join('|');
    return `${nodePart}##${edgePart}`;
  }
  let lastGraphSignature = null;

  // Later polls: hand ForceGraph3D a fresh dataset. 3d-force-graph merges
  // by node `id` -- nodes that already exist keep their current position
  // and velocity, only genuinely new nodes/links get added and animate in.
  // IMPORTANT: calling .graphData() at all reheats the physics simulation,
  // even if the data is identical to what's already loaded -- that's what
  // caused the whole graph to "wake up and jiggle" every poll. So we only
  // call it when something has actually changed.
  function refreshGraph({ nodes, edges }, baseSummary) {
    const signature = graphSignature(nodes, edges);
    if (signature === lastGraphSignature) return; // nothing changed -- stay static
    lastGraphSignature = signature;

    const incomingIds = new Set(nodes.map(n => n.id));
    const newImageIds = nodes
      .filter(n => !n.isHub && !knownIds.has(n.id))
      .map(n => n.id);
    const newCount = newImageIds.length;
    knownIds = incomingIds;

    const gData = {
      nodes: nodes.map(n => ({
        id: n.id, img: n.img, fullImg: n.fullImg, caption: n.caption, isHub: n.isHub, label: n.label,
        sceneBroad: n.sceneBroad, sceneSpecific: n.sceneSpecific,
        sceneConfidence: n.sceneConfidence,
      })),
      links: edges.map(e => ({ source: e.source, target: e.target, confidence: e.confidence }))
    };
    Graph.graphData(gData);

    const summary = `${nodes.filter(n => !n.isHub).length} images, ${edges.length} connections`;
    document.getElementById("status").textContent = summary;
    if (newCount > 0) {
      flashStatus(`+${newCount} new submission${newCount > 1 ? 's' : ''}`, summary);
      if (mode === 'tour') interruptForNewSubmission(newImageIds);
    }
  }

  function startPolling(baseSummary) {
    setInterval(() => {
      fetchGraphData()
        .then(data => refreshGraph(data, baseSummary))
        .catch(err => console.error("Poll for new submissions failed:", err));
    }, POLL_MS);
  }

  fetchGraphData()
    .then(initGraph)
    .catch(err => {
      document.getElementById("status").textContent =
        "Failed to load graph data: " + err.message;
      console.error(err);
    });
</script>

</body>
</html>
